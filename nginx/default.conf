```nginx
server {
    listen 80;
    server_name _;

    client_max_body_size 1m;

    # =========================
    # Node.js Auth Backend
    # =========================
    location /api/auth/ {
        proxy_pass https://todo-task-1-78q4.onrender.com/auth/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass_request_headers on;
        proxy_pass_request_body on;
    }

    # /api/auth -> /api/auth/
    location = /api/auth {
        return 308 /api/auth/;
    }


    # =========================
    # PHP Tasks Backend
    # =========================
    location /api/tasks/ {
        proxy_pass https://todo-task-1l6p.onrender.com/tasks/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass_request_headers on;
        proxy_pass_request_body on;
    }

    # /api/tasks -> /api/tasks/
    location = /api/tasks {
        return 308 /api/tasks/;
    }


    # =========================
    # Frontend
    # =========================
    location / {
        proxy_pass https://todo-task-2-t5z6.onrender.com;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
