server {
    listen 80;
    server_name _;

    client_max_body_size 1m;

    # =========================
    # NODE.JS AUTH API
    # =========================
    location ^~ /api/auth/ {
        proxy_pass https://todo-task-1-78q4.onrender.com/auth/;

        proxy_http_version 1.1;

        proxy_set_header Host todo-task-1-78q4.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_ssl_server_name on;
        proxy_ssl_name todo-task-1-78q4.onrender.com;
    }

    # =========================
    # PHP TASK API
    # =========================
    location ^~ /api/tasks/ {
        proxy_pass https://todo-task-1l6p.onrender.com/tasks/;

        proxy_http_version 1.1;

        proxy_set_header Host todo-task-1l6p.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_ssl_server_name on;
        proxy_ssl_name todo-task-1l6p.onrender.com;
    }

    # Redirect API base paths
    location = /api/auth {
        return 308 /api/auth/;
    }

    location = /api/tasks {
        return 308 /api/tasks/;
    }

    # =========================
    # FRONTEND SPA
    # =========================
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}